name: Windows portable release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: ./scripts/build.ps1
      - run: cargo test --workspace --locked
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/CarCar.exe
            release/carcar-launcher.exe
            release/carcar.cmd
            release/start.cmd
            release/bootstrap.ps1
            release/bootstrap-v2.ps1
            release/bootstrap-profile-*.ps1
            release/profile-*.carcar
            release/SHA256SUMS.txt
            release/repository.txt
            release/carcar.example.env
