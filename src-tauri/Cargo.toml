[package]
name = "carcar"
version = "1.0.0"
edition = "2021"
default-run = "CarCar"

[features]
ui-test = ["tauri/custom-protocol"]

[[bin]]
name = "CarCar"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "blocking"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tokio-util = "0.7"
futures-util = "0.3"
zeroize = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
arboard = { version = "3", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry"] }
